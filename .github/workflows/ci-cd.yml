name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_TEST_DATABASE: Kimuka3_test
  SECRET_KEY: seed-solo-para-pruebas-ci-cd
  FLASK_DEBUG: false

jobs:
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '3_0_API/requirements*.txt'
      - name: Instalar dependencias
        working-directory: 3_0_API
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas unitarias
        working-directory: 3_0_API
        run: pytest app/tests/unit -v

  integration-tests:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: Kimuka3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '3_0_API/requirements*.txt'
      - name: Instalar dependencias
        working-directory: 3_0_API
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas de integración
        working-directory: 3_0_API
        run: pytest app/tests/integration -v

  deploy:
    name: Despliegue
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Preparar la clave SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Desplegar en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST"
      - name: Comprobar desde internet
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "http://$EC2_HOST/health"
